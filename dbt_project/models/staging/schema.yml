version: 2

sources:
  - name: staging
    schema: staging
    tables:
      - name: tooted_raw
        description: "Tarnijakataloogide toorandmed päevaste hetktõmmistena (TME + Farnell)"

models:
  - name: stg_tooted
    description: "Puhastatud ja rikastatud tarnijakataloogi andmed"
    columns:
      - name: run_id
        description: "Pipeline käivituse ID"
        tests:
          - not_null
      - name: tarnija_kood
        description: "Tarnija kood (allikas)"
        tests:
          - not_null
          - accepted_values:
              values: ["TME", "FARNELL"]
      - name: sumbol
        description: "Poe enda sisemine kood (TME symbol või Farnell SKU)"
        tests:
          - not_null
      - name: mpn
        description: "Tootja-osakood (Manufacturer Part Number) tooted.csv seedist"
        tests:
          - not_null
      - name: kategooria
        description: "Toote kategooria tooted.csv seedist"
        tests:
          - not_null
          - accepted_values:
              values: ["resistors", "capacitors", "microcontrollers", "led diodes", "connectors", "transistors"]
      - name: hind
        description: "Ühiku hind väikseimal kogusetasandil"
        tests:
          - not_null
      - name: loplik_hind
        description: "Toote hind pärast allahindlust"
        tests:
          - not_null
      - name: min_kogus
        description: "Minimaalne tellitav kogus salvestatud hinna juures"
      - name: laetud_kuupaev
        description: "Hetktõmmise kuupäev"
        tests:
          - not_null
